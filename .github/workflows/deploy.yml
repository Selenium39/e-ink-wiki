# push main → 构建 + 部署 CF Pages（e-ink-wiki / wiki.e-ink.me）
# 与本地手动部署命令保持一致：pnpm build → wrangler pages deploy out
# 凭证：repo secret CLOUDFLARE_API_TOKEN（account ID 非机密，明文即可）
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # 读 package.json 的 packageManager 字段

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build # next build 默认 NODE_ENV=production，静态导出到 out/

      - name: Deploy
        run: npx wrangler@4 pages deploy out --project-name=e-ink-wiki --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: cb724477e6943c782c1f69610c60b155
